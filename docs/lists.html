<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a list</title>
<link rel="stylesheet" href="style.css">
<script>
  try {
    var saved = JSON.parse(localStorage.getItem('fa-site-colours') || '{}');
    for (var k in saved) document.documentElement.style.setProperty(k, saved[k]);
  } catch (e) {}
</script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Choose a list</h1>
      <p class="updated-at">Pick which group's rankings to view.</p>
    </div>
  </header>

  <main class="container">
    <div id="lists-browser">
      <div class="panel-controls">
        <div id="auth-slot"></div>
      </div>

      <p class="empty-note" id="lists-status">Loading…</p>

      <div id="custom-lists-section" hidden>
        <div class="panel-controls">
          <h2 style="margin:0;">Your lists</h2>
          <button type="button" class="csv-btn" id="new-list-btn" hidden>New list</button>
        </div>
        <p class="board-note" id="login-hint">Log in with WCA to create lists and see the ones you're on.</p>
        <div class="home-links" id="my-lists"></div>

        <h2 style="margin-top:2rem;">Public lists</h2>
        <div class="home-links" id="public-lists"></div>
      </div>
    </div>

    <div id="list-panel" hidden></div>
  </main>

  <!-- Loaded by dynamic import so a backend/CDN problem shows a message instead of a blank page. -->
  <script type="module">
    const status = document.getElementById('lists-status');
    import('./js/lists-page.js')
      .then((m) => m.initLists())
      .then(() => status.remove())
      .catch((err) => {
        console.warn('Lists unavailable:', err);
        status.textContent = 'Could not load lists. Please try again later.';
      });
  </script>
</body>
</html>
