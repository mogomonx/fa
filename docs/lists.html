<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lists</title>
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="header-btn menu-toggle" href="home.html" aria-label="Home" title="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <h1>Lists</h1>
    <span></span>
  </header>

  <main class="container">
    <div id="lists-browser">
      <div class="panel-controls">
        <div id="auth-slot"></div>
      </div>

      <p class="empty-note" id="lists-status">Loading…</p>

      <div id="custom-lists-section" hidden>
        <div class="panel-controls">
          <h2 style="margin:0;">Your lists</h2>
          <button type="button" class="csv-btn" id="new-list-btn" hidden>New list</button>
        </div>
        <p class="board-note" id="login-hint">Log in with WCA to create lists.</p>
        <div class="home-links" id="my-lists"></div>

        <h2 style="margin-top:2rem;">Public lists</h2>
        <div class="home-links" id="public-lists"></div>
      </div>
    </div>

    <div id="list-panel" hidden></div>
  </main>

  <!-- Loaded by dynamic import so a backend/CDN problem shows a message instead of a blank page. -->
  <script type="module">
    const status = document.getElementById('lists-status');
    import('./js/lists-page.js')
      .then((m) => m.initLists())
      .then(() => status.remove())
      .catch((err) => {
        console.warn('Lists unavailable:', err);
        status.textContent = 'Could not load lists. Please try again later.';
      });
  </script>
</body>
</html>
