<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a list</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Choose a list</h1>
      <p class="updated-at">Pick which group's rankings to view.</p>
    </div>
  </header>

  <main class="container">
    <div id="lists-browser">
      <div class="panel-controls">
        <div id="auth-slot"></div>
      </div>

      <h2>Built-in lists</h2>
      <div class="home-links" id="lists-directory">
        <p class="empty-note">Loading…</p>
      </div>

      <div id="custom-lists-section" hidden>
        <div class="panel-controls" style="margin-top:2rem;">
          <h2 style="margin:0;">My lists</h2>
          <button type="button" class="csv-btn" id="new-list-btn" hidden>New list</button>
        </div>
        <p class="board-note" id="login-hint">Log in with WCA to create lists and see the ones you're on.</p>
        <div class="home-links" id="my-lists"></div>

        <h2 style="margin-top:2rem;">Public lists</h2>
        <div class="home-links" id="public-lists"></div>
      </div>
    </div>

    <div id="list-panel" hidden></div>
  </main>

  <!-- Built-in lists: no backend involved, so this always works. -->
  <script>
    fetch('data/lists-manifest.json', { cache: 'no-store' })
      .then((res) => res.json())
      .then((manifest) => {
        const container = document.getElementById('lists-directory');
        container.innerHTML = '';
        (manifest.lists || []).forEach((list) => {
          const a = document.createElement('a');
          a.className = 'home-link';
          a.href = `index.html?list=${encodeURIComponent(list.id)}`;
          a.innerHTML = `<strong>${list.name}</strong><span>View this list's rankings</span>`;
          container.appendChild(a);
        });
        if ((manifest.lists || []).length === 0) {
          container.innerHTML = '<p class="empty-note">No lists configured yet.</p>';
        }
      })
      .catch(() => {
        document.getElementById('lists-directory').innerHTML =
          '<p class="empty-note">Could not load the list of lists.</p>';
      });
  </script>

  <!-- Custom lists: loaded separately so a backend/CDN problem can't break the above. -->
  <script type="module">
    import('./js/lists-page.js')
      .then((m) => m.initLists())
      .catch((err) => console.warn('Custom lists unavailable:', err));
  </script>
</body>
</html>
