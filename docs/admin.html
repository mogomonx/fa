<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh https://cdn.jsdelivr.net/npm/ 'wasm-unsafe-eval'; worker-src blob:; connect-src 'self' https://xqneepovezwhsbiqggdv.supabase.co https://wca-parquet.fawcastats.workers.dev https://pub-968764766d9f40a8b51a059fe21a1a34.r2.dev https://cdn.jsdelivr.net https://www.worldcubeassociation.org; img-src 'self' data: https://*.worldcubeassociation.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
<script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="header-btn" href="home.html" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    </a>
    <h1>Admin</h1>
    <span></span>
  </header>

  <main class="container">
    <div class="panel-controls" style="justify-content:flex-start;">
      <div id="auth-slot"></div>
    </div>

    <p id="admin-gate" class="empty-note">Loading…</p>

    <div id="admin-body" hidden>
      <details class="admin-section" open>
        <summary>Find a person</summary>
        <p class="board-note">hi you can set peoples state, add anyone (eg those from different countries or those who have only competed once) to state rankings, and more. enjoy.</p>
        <div class="admin-row">
          <input type="text" id="admin-person-input" placeholder="2012PARK03" maxlength="10" autocomplete="off">
          <button type="button" class="csv-btn" id="admin-person-find">Find</button>
        </div>
        <div id="admin-person-out"></div>
      </details>

      <details class="admin-section" open>
        <summary id="admin-unassigned-title">people with no state go here</summary>
        <div id="admin-unassigned"><p class="empty-note">Loading…</p></div>
      </details>

      <details class="admin-section">
        <summary>State overrides</summary>
        <div id="admin-overrides"><p class="empty-note">Loading…</p></div>
      </details>

      <details class="admin-section" open>
        <summary>Lists</summary>
        <div id="admin-lists"></div>
      </details>
    </div>
  </main>

  <script type="module" src="js/admin-boot.js"></script>
</body>
</html>
