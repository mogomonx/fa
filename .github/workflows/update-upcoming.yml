name: Update Upcoming Competitions

# Scans upcoming WCA competitions and uploads upcoming.json.
#   regular lists : ONE shared scan, matching registrants against every list's members
#   state lists   : competitions held inside each state (no registrants), a few seconds
# This is its own workflow (with its own queue) so the 9-minute scan can never
# hold up a new list's build in update-custom-lists.yml.
#   daily      : every list
#   on demand  : started by update-custom-lists.yml when a brand-new list is built,
#                or by hand from the Actions tab
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Its own group: runs here queue behind each other, never behind update-custom-lists.yml.
# If several are requested while one is running, GitHub keeps only the newest waiting one.
concurrency:
  group: upcoming-scan
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  LISTS_ROOT: build

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --all gives `slugs` (regular lists with members) and `state_slugs` (state
      # lists) as separate outputs, and writes build/states-input.json.
      - name: Sync lists from the database
        id: sync
        run: node scripts/sync-lists.js --all

      # State lists first: quick, and a failure in the long scan below can't block it.
      - name: Upcoming competitions for state lists
        if: steps.sync.outputs.state_slugs != ''
        env:
          STATE_SLUGS: ${{ steps.sync.outputs.state_slugs }}
        run: |
          node scripts/fetch-state-upcoming.js $STATE_SLUGS
          node scripts/upload-lists.js --files=upcoming.json $STATE_SLUGS

      - name: Scan upcoming competitions
        if: ${{ !cancelled() && steps.sync.outputs.slugs != '' }}
        env:
          SLUGS: ${{ steps.sync.outputs.slugs }}
        run: |
          node scripts/fetch-upcoming.js $SLUGS
          node scripts/upload-lists.js --files=upcoming.json $SLUGS
