name: Update Upcoming Competitions

# Separate from Personal Bests since this scans every upcoming WCA
# competition in a ~4 month window (one WCIF fetch per competition found),
# which is meaningfully heavier than the other daily jobs.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'config/members.json'
      - 'config/upcoming-competitions.json'
      - 'scripts/fetch-upcoming.js'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan upcoming competitions for group attendance
        run: node scripts/fetch-upcoming.js

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/upcoming.json
          git diff --staged --quiet || git commit -m 'Update upcoming competitions'
          git pull --rebase origin main
          git push
