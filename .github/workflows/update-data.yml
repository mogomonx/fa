name: Update WCA data

on:
  schedule:
    # 06:00 UTC every day. Edit the cron expression to change this.
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'config/members.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch results from the WCA API
        run: node scripts/fetch.js

      - name: Build rankings
        run: node scripts/build-rankings.js

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/results.json docs/data/rankings.json
          git diff --staged --quiet || git commit -m 'Update rankings data'
          git push
