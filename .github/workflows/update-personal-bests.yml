name: Update Personal Bests

# Cheap and fast (a handful of small API calls) -- keeps the FA Records
# page, Event Rankings, Sum of Ranks / Kinch, and the upcoming-competitions
# list fresh daily.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'config/members.json'
      - 'config/upcoming-competitions.json'
      - 'scripts/fetch.js'
      - 'scripts/fetch-upcoming.js'
      - 'scripts/build-rankings.js'
      - 'scripts/lib/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch personal bests from the WCA API
        run: node scripts/fetch.js

      - name: Build rankings
        run: node scripts/build-rankings.js

      - name: Fetch upcoming competition attendance
        run: node scripts/fetch-upcoming.js

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/results.json docs/data/rankings.json docs/data/upcoming.json
          git diff --staged --quiet || git commit -m 'Update personal bests'
          git pull --rebase origin main
          git push
