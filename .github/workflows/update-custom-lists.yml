name: Update Custom Lists

# Builds database-backed lists and uploads them to the private list-data bucket.
#   on demand    : a database trigger starts a `pending` run when a list is created
#                  or changed (the SQL lives in supabase/schema.sql, trigger_build())
#   every 15 min : the same `pending` run as a fallback (GitHub's cron is slow)
#   daily        : Parquet refresh on R2, then personal bests for finished lists
#                  (read from the fresh Parquet files; the WCA API only if that fails)
#   weekly       : list cleanup (expired lists, orphaned Storage folders), then full
#                  history for every list that is not dormant, plus every state list,
#                  plus the Parquet conversion and upload to Cloudflare R2
# Personal bests and official ranks come from the Parquet copy of the WCA export (rebuild
# step 7); scripts/fetch.js (WCA API) is only a last-resort fallback.
# Upcoming competitions are NOT here any more: see update-upcoming.yml.
# Also pings Supabase regularly, which keeps the free project awake.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [pending, bests, full]
        default: pending

permissions:
  contents: read
  actions: write   # only used to start update-upcoming.yml for brand-new lists

concurrency:
  group: custom-lists
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  LISTS_ROOT: build

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Work out mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              '*/15 * * * *') MODE=pending ;;
              '30 6 * * *') MODE=bests ;;
              *) MODE=full ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # List lifecycle (session 15): weekly (and manual full runs). Deletes lists nobody
      # has opened for 90 days (permanent lists are exempt), then removes Storage folders
      # that no longer belong to any list. Runs before the sync so expired lists are not
      # built. A failure here shows as an orange step and never stops the build.
      - name: Clean up expired lists and orphaned data
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        run: node scripts/cleanup-lists.js

      - name: Sync lists from the database
        id: sync
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            pending) node scripts/sync-lists.js --pending ;;
            bests)   node scripts/sync-lists.js --built ;;
            *)       node scripts/sync-lists.js --all ;;
          esac

      # The WCA export is only downloaded here to make the Parquet files (daily and weekly runs).
      # A pending run (ordinary or state lists) reads the Parquet copy on R2 and only downloads
      # the export inside the Full build step if that fails (the fallback).
      - name: Work out export URL
        id: export-url
        if: steps.mode.outputs.mode != 'pending'
        run: |
          TSV_URL=$(node scripts/get-export-url.js 2>/tmp/export-url.err | tail -n 1 | tr -d '\r\n' || true)

          if [[ "$TSV_URL" != http* ]]; then
            echo "Node script gave no URL ($(cat /tmp/export-url.err 2>/dev/null)). Trying curl..."
            TSV_URL=$(curl -fsSL -A "WCA-Parquet-Builder/1.0" \
              https://www.worldcubeassociation.org/api/v0/export/public \
              | jq -r '.tsv_url // empty' | tr -d '\r\n' || true)
          fi

          if [[ "$TSV_URL" != http* ]]; then
            echo "ERROR: could not resolve the WCA export URL."
            exit 1
          fi

          echo "Resolved export URL: $TSV_URL"
          echo "url=$TSV_URL" >> "$GITHUB_OUTPUT"

      - name: Download WCA results export
        if: steps.mode.outputs.mode != 'pending'
        env:
          EXPORT_URL: ${{ steps.export-url.outputs.url }}
        run: |
          if [ -z "$EXPORT_URL" ]; then
            echo "ERROR: EXPORT_URL is empty; refusing to run curl."
            exit 1
          fi
          rm -rf /tmp/wca-export /tmp/wca-export.zip
          mkdir -p /tmp/wca-export
          curl -fL --retry 3 --retry-delay 5 -A "WCA-Parquet-Builder/1.0" "$EXPORT_URL" -o /tmp/wca-export.zip
          unzip -q -o /tmp/wca-export.zip -d /tmp/wca-export
          echo "Extracted files:"
          ls -la /tmp/wca-export

      # Daily and weekly: refresh the Parquet files (about a minute). Both steps are
      # continue-on-error, and the later steps fall back (to the WCA API for personal
      # bests, to the export for history) if they fail.
      - name: Convert TSVs to Parquet
        id: convert
        if: steps.mode.outputs.mode != 'pending'
        continue-on-error: true
        env:
          WCA_EXPORT_DIR: /tmp/wca-export
          PARQUET_OUTPUT_DIR: build/parquet
        run: |
          pip install duckdb
          echo "Commit: $GITHUB_SHA"
          sha256sum scripts/convert-to-parquet.py
          python scripts/convert-to-parquet.py

      - name: Upload Parquet files to Cloudflare R2
        if: steps.mode.outputs.mode != 'pending' && steps.convert.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync build/parquet/ s3://wca-parquet-data/ \
            --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}"

      # Daily: personal bests + official ranks for finished lists, read from the Parquet files
      # made a moment ago. If the conversion did not succeed (or the extractor fails), the WCA
      # API (fetch.js) is used instead. !cancelled() so a failed export download above does not
      # stop the daily rankings refresh.
      - name: Daily personal bests
        if: ${{ !cancelled() && steps.mode.outputs.mode == 'bests' && steps.sync.outputs.slugs != '' }}
        env:
          SLUGS: ${{ steps.sync.outputs.slugs }}
          CONVERT_OUTCOME: ${{ steps.convert.outcome }}
        run: |
          DONE=0
          if [ "$CONVERT_OUTCOME" = "success" ]; then
            pip install --quiet duckdb
            echo "Building personal bests from Parquet (build/parquet)"
            if PARQUET_DIR=build/parquet python scripts/extract-bests-from-parquet.py $SLUGS; then
              DONE=1
            else
              echo "Parquet personal bests failed; falling back to the WCA API"
            fi
          else
            echo "No fresh Parquet files; using the WCA API for personal bests"
          fi
          if [ "$DONE" = "0" ]; then
            node scripts/fetch.js $SLUGS
          fi
          for s in $SLUGS; do
            node scripts/build-rankings.js "$s"
          done
          node scripts/upload-lists.js --files=rankings.json $SLUGS

      # Everything below reads the Parquet files when possible:
      #   full mode    -> the Parquet files made a moment ago (build/parquet)
      #   pending mode -> the public R2 copy from the last daily/weekly run
      # and falls back to the WCA API (personal bests) or streaming the WCA export
      # (parse-export.js, build-states.js with the TSVs) if the Parquet route is not
      # available or fails. Since rebuild step 7 a brand-new list gets everything in this
      # one step (there is no separate "basic" build any more); the browser shows instant
      # rankings until it finishes.
      - name: Full build (regular lists and state lists)
        if: steps.mode.outputs.mode != 'bests' && (steps.sync.outputs.slugs != '' || steps.sync.outputs.state_slugs != '')
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CONVERT_OUTCOME: ${{ steps.convert.outcome }}
          R2_PUBLIC_URL: https://pub-968764766d9f40a8b51a059fe21a1a34.r2.dev
          SLUGS: ${{ steps.sync.outputs.slugs }}
          STATE_SLUGS: ${{ steps.sync.outputs.state_slugs }}
          STATE_COUNTRIES: ${{ steps.sync.outputs.state_countries }}
        run: |
          ensure_export() {
            if [ -z "$(ls -A /tmp/wca-export 2>/dev/null)" ]; then
              echo "Downloading the WCA export (needed for the fallback)..."
              URL=$(node scripts/get-export-url.js 2>/dev/null | tail -n 1 | tr -d '\r\n')
              if [[ "$URL" != http* ]]; then echo "ERROR: no export URL"; exit 1; fi
              mkdir -p /tmp/wca-export
              curl -fL --retry 3 --retry-delay 5 -A "WCA-Parquet-Builder/1.0" "$URL" -o /tmp/wca-export.zip
              unzip -q -o /tmp/wca-export.zip -d /tmp/wca-export
            fi
          }

          PARQUET_SRC=""
          if [ "$MODE" = "pending" ]; then
            PARQUET_SRC="$R2_PUBLIC_URL"
          elif [ "$CONVERT_OUTCOME" = "success" ]; then
            PARQUET_SRC="build/parquet"
          fi
          if [ -n "$PARQUET_SRC" ]; then
            pip install --quiet duckdb
          fi

          # Regular lists: personal bests + official ranks (results.json), then rankings.json.
          # From Parquet; the WCA API (fetch.js) only if that fails.
          if [ -n "$SLUGS" ]; then
            BESTS_DONE=0
            if [ -n "$PARQUET_SRC" ]; then
              echo "Building personal bests from Parquet ($PARQUET_SRC)"
              if PARQUET_DIR="$PARQUET_SRC" python scripts/extract-bests-from-parquet.py $SLUGS; then
                BESTS_DONE=1
              else
                echo "Parquet personal bests failed; falling back to the WCA API"
              fi
            fi
            if [ "$BESTS_DONE" = "0" ]; then
              node scripts/fetch.js $SLUGS
            fi
            for s in $SLUGS; do
              node scripts/build-rankings.js "$s"
            done
          fi

          if [ -n "$STATE_SLUGS" ]; then
            STATES_DONE=0
            if [ -n "$PARQUET_SRC" ]; then
              echo "Building state data from Parquet ($PARQUET_SRC)"
              if PARQUET_DIR="$PARQUET_SRC" python scripts/extract-state-source.py $STATE_COUNTRIES \
                 && node scripts/build-states.js parquet $STATE_COUNTRIES; then
                STATES_DONE=1
              else
                echo "State build from Parquet failed; falling back to the export"
              fi
            fi
            if [ "$STATES_DONE" = "0" ]; then
              ensure_export
              node scripts/build-states.js /tmp/wca-export $STATE_COUNTRIES
            fi
            for s in $STATE_SLUGS; do
              node scripts/build-rankings.js "$s"
            done
          fi

          BUILT=0
          if [ -n "$PARQUET_SRC" ]; then
            echo "Building full-results.json from Parquet ($PARQUET_SRC)"
            if PARQUET_DIR="$PARQUET_SRC" python scripts/extract-from-parquet.py $SLUGS $STATE_SLUGS; then
              BUILT=1
            else
              echo "Parquet extraction failed; falling back to parse-export.js"
            fi
          fi
          if [ "$BUILT" = "0" ]; then
            ensure_export
            node scripts/parse-export.js /tmp/wca-export $SLUGS $STATE_SLUGS
          fi

          for s in $SLUGS; do
            echo "=== full: $s ==="
            node scripts/build-individual-rankings.js "$s"
            node scripts/build-historical-records.js "$s"
            node scripts/build-streaks.js "$s"
            node scripts/build-recent-activity.js "$s"
            node scripts/build-rolling-averages.js "$s"
          done

          # State lists: only the files the state pages use (history + streaks), 4 at a time.
          if [ -n "$STATE_SLUGS" ]; then
            printf '%s\n' $STATE_SLUGS | xargs -P 4 -I{} sh -c \
              'echo "=== state: {} ===" && node scripts/build-individual-rankings.js {} && node scripts/build-historical-records.js {} && node scripts/build-streaks.js {}'
          fi

          node scripts/upload-lists.js --level=full $SLUGS $STATE_SLUGS
          node scripts/mark-lists.js --level=full $SLUGS $STATE_SLUGS

      # Brand-new lists get their Upcoming data from a separate workflow, so this
      # run is not held up by the 9-minute scan. Failing to start it is harmless:
      # update-upcoming.yml also runs daily.
      - name: Start the Upcoming scan for brand-new lists
        if: steps.mode.outputs.mode == 'pending' && steps.sync.outputs.new_slugs != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-upcoming.yml --ref "${{ github.ref_name }}"
