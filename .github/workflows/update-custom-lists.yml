name: Update Custom Lists

# Builds database-backed lists and uploads them to the private list-data bucket.
#   every 15 min : new/edited lists (basic rankings first, then full history);
#                  state lists too when someone changed their state
#   daily        : personal bests for finished lists
#   weekly       : full history for every list, plus every state list,
#                  plus the Parquet conversion and upload to Cloudflare R2
# Also pings Supabase regularly, which keeps the free project awake.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [pending, bests, full]
        default: pending

permissions:
  contents: read

concurrency:
  group: custom-lists
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  LISTS_ROOT: build

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Work out mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              '*/15 * * * *') MODE=pending ;;
              '30 6 * * *') MODE=bests ;;
              *) MODE=full ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Sync lists from the database
        id: sync
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          case "$MODE" in
            pending) node scripts/sync-lists.js --pending ;;
            bests)   node scripts/sync-lists.js --built ;;
            *)       node scripts/sync-lists.js --all ;;
          esac

      - name: Daily personal bests
        if: steps.mode.outputs.mode == 'bests' && steps.sync.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.sync.outputs.slugs }}
        run: |
          node scripts/fetch.js $SLUGS
          for s in $SLUGS; do
            node scripts/build-rankings.js "$s"
          done
          node scripts/upload-lists.js --files=rankings.json $SLUGS

      - name: Fast basic build for brand-new lists
        if: steps.mode.outputs.mode == 'pending' && steps.sync.outputs.new_slugs != ''
        env:
          NEW_SLUGS: ${{ steps.sync.outputs.new_slugs }}
        run: |
          node scripts/fetch.js $NEW_SLUGS
          for s in $NEW_SLUGS; do
            echo "=== basic: $s ==="
            node scripts/build-rankings.js "$s"
            node scripts/make-empty-history.js "$s"
            node scripts/build-individual-rankings.js "$s"
            node scripts/build-historical-records.js "$s"
            node scripts/build-streaks.js "$s"
            node scripts/build-recent-activity.js "$s"
            node scripts/build-rolling-averages.js "$s"
          done
          node scripts/upload-lists.js --level=basic $NEW_SLUGS
          node scripts/mark-lists.js --level=basic $NEW_SLUGS

      - name: Work out export URL
        id: export-url
        if: steps.mode.outputs.mode != 'bests' && (steps.sync.outputs.slugs != '' || steps.sync.outputs.state_slugs != '')
        run: |
          TSV_URL=$(node scripts/get-export-url.js 2>/tmp/export-url.err | tail -n 1 | tr -d '\r\n' || true)

          if [[ "$TSV_URL" != http* ]]; then
            echo "Node script gave no URL ($(cat /tmp/export-url.err 2>/dev/null)). Trying curl..."
            TSV_URL=$(curl -fsSL -A "WCA-Parquet-Builder/1.0" \
              https://www.worldcubeassociation.org/api/v0/export/public \
              | jq -r '.tsv_url // empty' | tr -d '\r\n' || true)
          fi

          if [[ "$TSV_URL" != http* ]]; then
            echo "ERROR: could not resolve the WCA export URL."
            exit 1
          fi

          echo "Resolved export URL: $TSV_URL"
          echo "url=$TSV_URL" >> "$GITHUB_OUTPUT"

      - name: Download WCA results export
        if: steps.mode.outputs.mode != 'bests' && (steps.sync.outputs.slugs != '' || steps.sync.outputs.state_slugs != '')
        env:
          EXPORT_URL: ${{ steps.export-url.outputs.url }}
        run: |
          if [ -z "$EXPORT_URL" ]; then
            echo "ERROR: EXPORT_URL is empty; refusing to run curl."
            exit 1
          fi
          rm -rf /tmp/wca-export /tmp/wca-export.zip
          mkdir -p /tmp/wca-export
          curl -fL --retry 3 --retry-delay 5 -A "WCA-Parquet-Builder/1.0" "$EXPORT_URL" -o /tmp/wca-export.zip
          unzip -q -o /tmp/wca-export.zip -d /tmp/wca-export
          echo "Extracted files:"
          ls -la /tmp/wca-export

      - name: Full build
        if: steps.mode.outputs.mode != 'bests' && steps.sync.outputs.slugs != ''
        env:
          SLUGS: ${{ steps.sync.outputs.slugs }}
        run: |
          node scripts/fetch.js $SLUGS
          for s in $SLUGS; do
            node scripts/build-rankings.js "$s"
          done
          node scripts/parse-export.js /tmp/wca-export $SLUGS
          for s in $SLUGS; do
            echo "=== full: $s ==="
            node scripts/build-individual-rankings.js "$s"
            node scripts/build-historical-records.js "$s"
            node scripts/build-streaks.js "$s"
            node scripts/build-recent-activity.js "$s"
            node scripts/build-rolling-averages.js "$s"
          done
          node scripts/upload-lists.js --level=full $SLUGS
          node scripts/mark-lists.js --level=full $SLUGS

      # NOTE: written from the architecture doc. If your previous workflow had
      # the parallel (xargs -P 4) state step or the state full-history pass,
      # copy that block over this one from the file's History on GitHub.
      - name: State rankings
        if: steps.mode.outputs.mode != 'bests' && steps.sync.outputs.state_slugs != ''
        env:
          STATE_SLUGS: ${{ steps.sync.outputs.state_slugs }}
          STATE_COUNTRIES: ${{ steps.sync.outputs.state_countries }}
        run: |
          node scripts/build-states.js /tmp/wca-export $STATE_COUNTRIES
          for s in $STATE_SLUGS; do
            echo "=== state: $s ==="
            node scripts/build-rankings.js "$s"
            node scripts/make-empty-history.js "$s"
            node scripts/build-individual-rankings.js "$s"
            node scripts/build-historical-records.js "$s"
            node scripts/build-streaks.js "$s"
            node scripts/build-recent-activity.js "$s"
            node scripts/build-rolling-averages.js "$s"
          done
          node scripts/upload-lists.js --level=full $STATE_SLUGS
          node scripts/mark-lists.js --level=full $STATE_SLUGS

      # Weekly (full) only. Both steps are continue-on-error so a Parquet or
      # R2 problem can never stop the site's lists from updating.
      - name: Convert TSVs to Parquet
        id: convert
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env:
          WCA_EXPORT_DIR: /tmp/wca-export
          PARQUET_OUTPUT_DIR: build/parquet
        run: |
          pip install duckdb
          echo "Commit: $GITHUB_SHA"
          sha256sum scripts/convert-to-parquet.py
          python scripts/convert-to-parquet.py

      - name: Upload Parquet files to Cloudflare R2
        if: steps.mode.outputs.mode == 'full' && steps.convert.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync build/parquet/ s3://wca-parquet-data/ \
            --endpoint-url "${{ secrets.R2_ENDPOINT_URL }}"

      - name: Upcoming competitions
        if: (steps.mode.outputs.mode == 'bests' || steps.mode.outputs.mode == 'full') && steps.sync.outputs.slugs != ''
        continue-on-error: true
        env:
          SLUGS: ${{ steps.sync.outputs.slugs }}
        run: |
          node scripts/fetch-upcoming.js $SLUGS
          node scripts/upload-lists.js --files=upcoming.json $SLUGS
