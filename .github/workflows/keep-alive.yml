name: Keep Alive

# GitHub disables scheduled workflows after 60 days without repository
# activity. Nothing else commits once the built-in lists are retired, so
# make a small empty commit whenever the last commit is 30+ days old.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if the repo has gone quiet
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Last commit is $AGE_DAYS days old"
          if [ "$AGE_DAYS" -ge 30 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep scheduled workflows alive'
            git push
          fi
