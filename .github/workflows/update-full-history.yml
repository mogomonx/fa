name: Update Full Result History

# Heavier: downloads the official WCA results export (~350MB) once, then
# filters it for every list configured in config/lists-manifest.json.
# Downloading once and filtering per-list (rather than downloading once
# per list) keeps this from scaling badly as more lists get added.
# Runs weekly since it's a much bigger download than the daily
# personal-bests update -- run it manually (Actions tab -> this workflow
# -> Run workflow) any time you want it sooner, e.g. right after a
# competition your group attended.
on:
  schedule:
    - cron: '0 6 * * 0'   # 06:00 UTC every Sunday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WCA results export
        run: |
          TSV_URL=$(node scripts/get-export-url.js)
          echo "Downloading $TSV_URL"
          curl -sL "$TSV_URL" -o /tmp/wca-export.zip
          mkdir -p /tmp/wca-export
          unzip -q -o /tmp/wca-export.zip -d /tmp/wca-export
          echo "Extracted files:"
          ls -la /tmp/wca-export

      - name: Parse export + build derived data, for every list
        run: |
          for id in $(jq -r '.lists[].id' config/lists-manifest.json); do
            echo "=== List: $id ==="
            node scripts/parse-export.js /tmp/wca-export "$id"
            node scripts/build-individual-rankings.js "$id"
            node scripts/build-historical-records.js "$id"
            node scripts/build-streaks.js "$id"
            node scripts/build-recent-activity.js "$id"
            node scripts/build-rolling-averages.js "$id"
          done

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data
          git diff --staged --quiet || git commit -m 'Update full result history'
          git pull --rebase origin main
          git push
