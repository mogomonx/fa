name: Update Full Result History

# Heavier: downloads the official WCA results export (~350MB) to get every
# competition result anyone in the group has ever recorded, not just their
# personal bests. Powers the Individual Results tab, the top-100 tally, and
# the average solve breakdowns. Runs weekly since it's a much bigger
# download than the daily personal-bests update -- run it manually
# (Actions tab -> this workflow -> Run workflow) any time you want it
# sooner, e.g. right after a competition your group attended.
on:
  schedule:
    - cron: '0 6 * * 0'   # 06:00 UTC every Sunday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download WCA results export
        run: |
          TSV_URL=$(node scripts/get-export-url.js)
          echo "Downloading $TSV_URL"
          curl -sL "$TSV_URL" -o /tmp/wca-export.zip
          mkdir -p /tmp/wca-export
          unzip -q -o /tmp/wca-export.zip -d /tmp/wca-export
          echo "Extracted files:"
          ls -la /tmp/wca-export

      - name: Parse export for our group
        run: node scripts/parse-export.js /tmp/wca-export

      - name: Build individual-result rankings
        run: node scripts/build-individual-rankings.js

      - name: Build historical FA record list
        run: node scripts/build-historical-records.js

      - name: Build PR streaks
        run: node scripts/build-streaks.js

      - name: Build recent activity feed
        run: node scripts/build-recent-activity.js

      - name: Commit updated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/full-results.json docs/data/individual-rankings.json docs/data/historical-records.json docs/data/streaks.json docs/data/recent-activity.json
          git diff --staged --quiet || git commit -m 'Update full result history'
          git pull --rebase origin main
          git push
